<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nandini's Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Nandini's Gallery</h1>
        <p>Explore Through My Lens</p>
    </header>

    <main class="gallery">

        <div class="gallery-item">
            <img src="images/image1.jpg" alt="Gallery Image 1" onclick="openLightbox(0)">
        </div>

        <div class="gallery-item">
            <img src="images/image2.jpg" alt="Gallery Image 2" onclick="openLightbox(1)">
        </div>

        <div class="gallery-item">
            <img src="images/image3.jpg" alt="Gallery Image 3" onclick="openLightbox(2)">
        </div>

        <div class="gallery-item">
            <img src="images/image4.jpg" alt="Gallery Image 4" onclick="openLightbox(3)">
        </div>

        <div class="gallery-item">
            <img src="images/image5.jpg" alt="Gallery Image 5" onclick="openLightbox(4)">
        </div>

        <div class="gallery-item">
            <img src="images/image6.jpg" alt="Gallery Image 6" onclick="openLightbox(5)">
        </div>

    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="changeImage(-1)">&#10094;</button>

        <img id="lightbox-img" src="" alt="Large Image">

        <button class="next" onclick="changeImage(1)">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
